<header class="app-header">
  <button class="header-menu-btn" type="button" aria-label="เปิดเมนู" aria-controls="shellSidebarAside" aria-expanded="false">
    <i class="bi bi-list" aria-hidden="true"></i>
  </button>
  <div class="header-search" role="search">
    <i class="bi bi-search" aria-hidden="true"></i>
    <input type="search" placeholder="ค้นหาอุปกรณ์ / รหัส / รุ่น / Serial แล้วกด Enter" aria-label="ค้นหาอุปกรณ์ รหัส รุ่น หรือ Serial แล้วกด Enter">
  </div>
  <div class="header-actions">
    <a class="icon-btn header-search-mobile" href="inventory.html?focus=1" aria-label="ค้นหาอุปกรณ์">
      <i class="bi bi-search" aria-hidden="true"></i>
    </a>
    <button class="icon-btn" type="button" aria-label="การแจ้งเตือน" aria-haspopup="true" aria-expanded="false" data-panel-toggle="#notifPanel">
      <i class="bi bi-bell" aria-hidden="true"></i><span class="icon-btn__dot" aria-hidden="true"></span>
    </button>
    <div class="dropdown-panel d-none" id="notifPanel" role="menu">
      <div class="dropdown-panel__head">การแจ้งเตือน</div>
      <div class="dropdown-panel__body">
        <div class="text-muted-2 text-center py-3" style="font-size:12.5px">กำลังโหลดการแจ้งเตือน…</div>
      </div>
    </div>
    <button class="user-chip" type="button" aria-haspopup="true" aria-expanded="false" data-panel-toggle="#userPanel">
      <div class="user-avatar" aria-hidden="true">IT</div>
      <div class="user-chip__text"><div class="user-chip__name">IT Support</div><div class="user-chip__role">แผนก IT</div></div>
      <i class="bi bi-chevron-down" aria-hidden="true" style="font-size:11px;color:var(--color-muted)"></i>
    </button>
    <div class="dropdown-panel d-none" id="userPanel" style="width:200px" role="menu">
      <div class="dropdown-panel__body">
        <a class="notif-row" href="#" role="menuitem" style="text-decoration:none;color:inherit"><i class="bi bi-person" aria-hidden="true"></i>&nbsp; โปรไฟล์</a>
        <a class="notif-row" href="#" role="menuitem" style="text-decoration:none;color:var(--color-danger-text)"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>&nbsp; ออกจากระบบ</a>
      </div>
    </div>
  </div>
</header>
